services:
  machine1:
    build:
      context: .
      dockerfile: Dockerfile.machine
      args:
        - PORT=3001
        - AGENT_PEERS=10.89.2.12,10.89.2.13
    container_name: machine1
    hostname: machine1
    cap_add:
      - IPC_LOCK
      - NET_RAW
    env_file:
      - .env
    environment:
      - URI=mongodb://10.89.2.11:5984/v2grid 
      - PORT=3001
      - AGENT_NAME=machine1
      - AGENT_PEERS=machine2,machine3
    ports:
      - "5984:5984"
      - "3001:3001"
      - "8081:8081"
      - "8001:8000"
    volumes:
      - ./server:/app/server
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - machine1-data:/opt/couchdb/data
    networks:
      # default: {}
      machine-cluster:
        ipv4_address: 10.89.2.11
        aliases:
          - machine1

  machine2:
    build:
      context: .
      dockerfile: Dockerfile.machine
      args:
        - PORT=3002
        - AGENT_PEERS=10.89.2.11,10.89.2.13
    container_name: machine2
    hostname: machine2
    # FOR TESTING WITH PING
    cap_add:
      - IPC_LOCK
      - NET_RAW
    environment:
      - URI=mongodb://10.89.2.12:5984/v2grid 
      - PORT=3002
      - AGENT_NAME=machine2
      - AGENT_PEERS=machine1,machine3
    ports:
      - "5985:5984"
      - "3002:3002"
      - "8082:8082"
      - "8002:8000"
    volumes:
      - ./server:/app/server
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - machine2-data:/opt/couchdb/data
    networks:
      # default: {}
      machine-cluster:
        ipv4_address: 10.89.2.12
        aliases:
          - machine2

  machine3:
    build:
      context: .
      dockerfile: Dockerfile.machine
      args:
        - PORT=3003
        - AGENT_PEERS=10.89.2.11,10.89.2.12
    container_name: machine3
    hostname: machine3
    # FOR TESTING WITH PING
    cap_add:
      - IPC_LOCK
      - NET_RAW
    environment:
      - URI=mongodb://10.89.2.13:5984/v2grid 
      - PORT=3003
      - AGENT_NAME=machine3
      - AGENT_PEERS=machine1,machine2
    ports:
      - "5986:5984"
      - "3003:3003"
      - "8083:8083"
      - "8003:8000"
    volumes:
      - ./server:/app/server
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - machine3-data:/opt/couchdb/data
    networks:
      # default: {}
      machine-cluster:
        ipv4_address: 10.89.2.13
        aliases:
          - machine3

volumes:
  machine1-data:
  machine2-data:
  machine3-data:

networks:
  machine-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.2.0/24
    # internal: true

  # default:
  #   driver: bridge
    # enable_icc: false # Disable inter-container communication by default (doesn't work with podman)
