version: '3.8'

services:
  machine1:
    build:
      context: .
      dockerfile: Dockerfile.machine
      args:
        - PORT=3001
        # - AGENT_PEERS=10.89.2.12:3002,10.89.2.13:3003,10.89.2.14:3004,10.89.2.15:3005
    container_name: machine1
    hostname: machine1
    cap_add:
      - IPC_LOCK
      - NET_RAW
    environment:
      - MONGO_URI=mongodb://10.89.2.11:27018/v2grid
      - REPL_MONGO_URI=mongodb://10.89.2.11:27018,10.89.2.12:3002,10.89.2.13:3003,10.89.2.14:3004,10.89.2.15:3005/v2grid?replicaSet=shard1
      - PORT=3001
      - DB_NAME=v2grid
      - AGENT_ID=machine1
      - AGENT_NAME=machine1
    #   - AGENT_PEERS=10.89.2.12:3002,10.89.2.13:3003,10.89.2.14:3004,10.89.2.15:3005
    ports:
      - "27018:27018"
      - "3001:3001"
      - "8001:8000"
      - "8081:8081"
    volumes:
      - ./server:/app/server
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - machine1-data:/data/db
    networks:
      mongo-cluster:
        ipv4_address: 10.89.2.11
        aliases:
          - machine1
  machine2:
