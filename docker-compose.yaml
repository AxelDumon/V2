# MONGO avec un shard de 3 noeuds
# 
# Auteur : P Mathieu
# Date   : 20/08/2021
#
# Pour le lancer
# docker-compose up -d

# Pour s'y connecter
# docker exec -it node1  mongosh --port 27018
# docker exec -it node2  mongosh --port 27018

# Pour arrêter
# docker-compose down -v


# ATTENTION, par defaut
# mongod , mongos servent sur 27017
# un shardsrv sert sur le port 27018
# un configSvr sert sur le port 27019

#---------------------------------------

services:
  machine1:
    build:
      context: .
      dockerfile: Dockerfile.machine
    container_name: machine1
    hostname: machine1
    environment:
      # - MONGO_URI=mongodb://localhost:27018/v2grid?replicaSet=shard1
      - MONGO_URI=mongodb://machine1:27018,machine2:27018,machine3:27018/?replicaSet=shard1
      - PORT=3001
      - DB_NAME=v2grid_machine1
      - AGENT_ID=machine1
      - AGENT_PEERS=http://machine2:3002,http://machine3:3003
    ports:
      - "27018:27018"
      - "3001:3001"
      - "8001:8000"
    volumes:
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - machine1-data:/data/db
    networks:
      v2_mongo-cluster:
        aliases:
          - machine1

  machine2:
    build:
      context: .
      dockerfile: Dockerfile.machine
    container_name: machine2
    hostname: machine2
    environment:
      - MONGO_URI=mongodb://machine1:27018,machine2:27018,machine3:27018/?replicaSet=shard1
      # - MONGO_URI=mongodb://localhost:27018/v2grid?replicaSet=shard1
      - PORT=3002
      - DB_NAME=v2grid_machine2
      - AGENT_ID=machine2
      - AGENT_PEERS=http://machine1:3001,http://machine3:3003
    ports:
      - "27019:27018"
      - "3002:3002"
      - "8002:8000"
    volumes:
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - machine2-data:/data/db
    networks:
      v2_mongo-cluster:
        aliases:
          - machine2

  machine3:
    build:
      context: .
      dockerfile: Dockerfile.machine
    container_name: machine3
    hostname: machine3
    environment:
      - MONGO_URI=mongodb://machine1:27018,machine2:27018,machine3:27018/?replicaSet=shard1
      # - MONGO_URI=mongodb://localhost:27018/v2grid?replicaSet=shard1
      - PORT=3003
      - DB_NAME=v2grid_machine3
      - AGENT_ID=machine3
      - AGENT_PEERS=http://machine1:3001,http://machine2:3002
    ports:
      - "27020:27018"
      - "3003:3003"
      - "8003:8000"
    volumes:
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - machine3-data:/data/db
    networks:
      v2_mongo-cluster:
        aliases:
          - machine3

volumes:
  machine1-data:
  machine2-data:
  machine3-data:

networks:
  v2_mongo-cluster:
    driver: bridge